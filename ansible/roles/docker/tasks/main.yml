---
# tasks file for roles/docker

- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker's official GPG key
  ansible.builtin.shell: >
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg
    | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  register: docker_gpg_key
  changed_when: docker_gpg_key.rc == 0

- name: Set Docker architecture
  ansible.builtin.set_fact:
    docker_arch: >-
      {% if ansible_architecture == 'x86_64' %}amd64
      {% elif ansible_architecture == 'aarch64' %}arm64
      {% elif ansible_architecture == 'armv7l' %}armhf
      {% else %}{{ ansible_architecture }}
      {% endif %}

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes









- name: Set Docker architecture
  ansible.builtin.set_fact:
    docker_arch: >-
      {% if ansible_architecture == 'x86_64' %}amd64
      {% elif ansible_architecture == 'aarch64' %}arm64
      {% elif ansible_architecture == 'armv7l' %}armhf
      {% else %}{{ ansible_architecture }}
      {% endif %}

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker