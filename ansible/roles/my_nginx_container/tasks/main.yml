---
# tasks file for roles/nginx_container

- name: Ensure Docker is installed
  package:
    name: docker-ce
    state: present
  become: yes

- name: Ensure Docker is running and enabled
  service:
    name: docker
    state: started
    enabled: yes
  become: yes

- name: Pull PHP 8.3 FPM image
  community.docker.docker_image:
    name: tricolorsimba/php_8.3-fpm:latest
    source: pull  

- name: Ensure project directories exist
  file:
    # {{ Item }} and loop: are used to avoid 
    # repeating the same "file:" hierarchy
    path: "{{ item }}"
    state: directory
    mode: '0755'
  # {{ Item }} and loop: are used to avoid 
  # repeating the same "file:" hierarchy
  loop:
    - "{{ nginx_project_path }}"
    - "{{ nginx_html_path }}"
  become: yes

# - name: Ensure html directory exists
#   file:
#     path: "{{ nginx_html_path }}"
#     state: directory
#     mode: '0755'

# - name: Check if index.php exists
#   stat:
#     path: "{{ nginx_html_path }}/index.php"
#   register: index_php_file

# - name: Deploy index.php if it doesn't exist
#   template:
#     src: index.php
#     dest: "{{ nginx_html_path }}"
#   become: yes
#   when: not index_php_file.stat.exists

# - name: Ensure nginx directory exists
  file:
    path: "{{ nginx_project_path }}/nginx"
    state: directory

- name: Ensure default.conf is not a directory
  file:
    path: "{{ nginx_project_path }}/nginx/default.conf"
    state: absent

- name: Deploy nginx config
  template:
    src: default.conf.j2
    dest: "{{ nginx_project_path }}/nginx/default.conf"

- name: Deploy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ nginx_project_path }}/docker-compose.yml"

- name: Login to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"

- name: Start stack
  community.docker.docker_compose_v2:
    project_src: "{{ nginx_project_path }}"
    state: present
  become: yes

- name: Import ssl_certificate role
  import_role:
    name: ssl_certificate
  vars:
    # Path to save SSL certificates and Keys on host
    # (Create a volume if using containers and map this 
    # path with the one used by your container)
    ssl_cert_path: /opt/webserver/nginx/ssl

    # Name of the files to create 
    # (ex: ssl_cert_name.crt + ssl_cert_name.csr + ssl_cert_name.key)
    ssl_cert_name: nginx_ssl_cert

    ssl_common_name: "nginx.{{ inventory_hostname }}"
    ssl_country: "PT"
    ssl_state: "Porto"
    ssl_locality: "Maia"
    ssl_org: "technova.pt"
    ssl_org_unit: "SysAdmin"

    ssl_valid_days: 365

    ssl_key_size: 2048
    ssl_force_regenerate: false

- name: Install mysqli extension in PHP container
  command: >
    docker exec webserver-php83-1 docker-php-ext-install mysqli

- name: Restart PHP container
  community.docker.docker_container:
    name: webserver-php83-1
    state: started
    restart: true