[global]
   workgroup = TECHNOVA
   server string = TechNova File Server
   netbios name = INFRA

   security = user
   map to guest = never
   guest account = nobody

   passdb backend = ldapsam:ldap://127.0.0.1
   ldap suffix = dc=technova,dc=local
   ldap user suffix = ou=users
   ldap group suffix = ou=groups
   ldap admin dn = cn=admin,dc=technova,dc=local
   ldap ssl = no
   ldap passwd sync = yes

   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

   socket options = TCP_NODELAY
   dns proxy = no

[share]
   comment = TechNova Shared Folder
   path = /srv/samba/share
   browseable = yes
   read only = no
   guest ok = no
   valid users = @smbusers sysadmin operator
   force group = smbusers
   create mask = 0664
   directory mask = 0775